{% extends "base.html" %}
{% block content %}
<h1>{{ 'Регистрация' if register else 'Вход' }}</h1>
<form method="post" class="edit narrow">
  <label>Имя <input name="username" autofocus required></label>
  <label>Пароль <input type="password" name="password" required></label>
  <button class="btn">{{ 'Создать аккаунт' if register else 'Войти' }}</button>
</form>
<p>{% if register %}Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>{% else %}Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>{% endif %}</p>
{% endblock %}
